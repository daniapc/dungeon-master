{% extends "base.html" %} {% block content %}

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/jeu.css') }}" />

<div class="container-fluid game-container mt-4">
  <div class="row justify-content-center text-center title-section">
    <div class="col-12">
      <img
        src="{{ url_for('static', filename='temp.png') }}"
        alt="Game Logo"
        class="img-fluid game-logo"
      />
    </div>
  </div>

  <div class="row main-layout">
    <div class="col-md-3 col-lg-2 sideBar">
      <div class="panel tools-panel mb-3" style="display: none">
        <div class="panel-header">
          <i class="fa-solid fa-hammer"></i> Build Tools
        </div>

        <div class="selectionSidebar d-grid gap-2">
          <button type="button" class="btn btn-game" data-type="mur">
            <div class="d-flex justify-content-between align-items-center">
              <span><i class="fa-solid fa-square"></i> Mur</span>
              <span class="badge-cost"><span class="cout">--</span></span>
            </div>
          </button>

          <button type="button" class="btn btn-game" data-type="piege 1">
            <div class="d-flex justify-content-between align-items-center">
              <span><i class="fa-solid fa-skull"></i> Piège _</span>
              <span class="badge-cost"><span class="cout">--</span></span>
            </div>
          </button>

          <button type="button" class="btn btn-game" data-type="piege 2">
            <div class="d-flex justify-content-between align-items-center">
              <span><i class="fa-solid fa-bolt"></i> Piège ^</span>
              <span class="badge-cost"><span class="cout">--</span></span>
            </div>
          </button>

          <button type="button" class="btn btn-game" data-type="piege 3">
            <div class="d-flex justify-content-between align-items-center">
              <span><i class="fa-solid fa-bomb"></i> Piège ¤</span>
              <span class="badge-cost"><span class="cout">--</span></span>
            </div>
          </button>
          <button type="button" class="btn btn-game" data-type="monster">
            <div class="d-flex justify-content-between align-items-center">
              <span><i class="fa-solid fa-ghost"></i> Monster </span>
              <span class="badge-cost"><span class="cout">--</span></span>
            </div>
          </button>

          <hr class="separator" />

          <button
            type="button"
            class="btn btn-game btn-delete"
            data-type="supprimer"
          >
            <span><i class="fa-solid fa-trash"></i> Supprimer</span>
          </button>
        </div>
      </div>

      <div class="panel strategiePanel d-grid gap-2 mb-3">
        <div class="panel-header">
          <i class="fa-solid fa-robot"></i> Choix de l'IA
        </div>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="switchCheckDefault"
          />
          <label class="form-check-label" for="switchCheckDefault"
            >Chemin le plus court</label
          >
        </div>
      </div>

      <div class="panel controlSidebar d-grid gap-2">
        <button
          type="button"
          class="btn btn-action success"
          data-type="lancer"
          style="display: none; font-size: 0.75em"
        >
          <i class="fa-solid fa-play"></i> Lancer la vague
        </button>
        <button
          type="button"
          class="btn btn-action success"
          data-type="continuer"
          style="display: none"
        >
          <i class="fa-solid fa-play"></i> Continuer la vague
        </button>
        <button
          type="button"
          class="btn btn-action success"
          data-type="prochain"
          style="display: none"
        >
          <i class="fa-solid fa-play"></i> Prochaine vague
        </button>
        <button
          type="button"
          class="btn btn-action sauvegarder"
          data-type="sauvegarder"
          style="font-size: 0.8em"
        >
          <i class="fa-solid fa-floppy-disk"></i> Sauvegarder
        </button>
        <input
          type="file"
          id="jsonInput"
          accept=".json"
          style="display: none"
        />
        <button
          type="button"
          class="btn btn-action charger"
          data-type="charger"
          style="font-size: 0.8em"
        >
          <i class="fa-solid fa-floppy-disk"></i> Charger
        </button>
        <button type="button" class="btn btn-action danger" data-type="quitter">
          <i class="fa-solid fa-door-open"></i> Quitter
        </button>
      </div>
    </div>

    <div
      class="col-md-9 col-lg-8 d-flex justify-content-center align-items-start"
    >
      <div id="grid-board" class="shadow-lg"></div>

      <div id="recap-board" class="panel shadow-lg" style="display: none">
        <div class="recap-header">
          <div class="label">Rapport de Vague</div>
          <div class="value-head">Vague</div>
          <div class="value-head">Total</div>
        </div>

        <div class="recap-row heros-engages">
          <div class="label">
            <i class="fa-solid fa-users"></i> Héros engagés
          </div>
          <div class="value vague">--</div>
          <div class="value total">--</div>
        </div>

        <div class="recap-row heros-morts">
          <div class="label">
            <i class="fa-solid fa-skull"></i> Héros éliminés
          </div>
          <div class="value vague">--</div>
          <div class="value total">--</div>
        </div>

        <div class="divider"></div>

        <div class="recap-row pieges-faibles">
          <div class="label">
            <i class="fa-solid fa-bolt"></i> Pièges Faibles
          </div>
          <div class="value vague">--</div>
          <div class="value total">--</div>
        </div>

        <div class="recap-row pieges-moyens">
          <div class="label">
            <i class="fa-solid fa-bomb"></i> Pièges Moyens
          </div>
          <div class="value vague">--</div>
          <div class="value total">--</div>
        </div>

        <div class="recap-row pieges-puissants">
          <div class="label">
            <i class="fa-solid fa-explosion"></i> Pièges Puissants
          </div>
          <div class="value vague">--</div>
          <div class="value total">--</div>
        </div>

        <div class="divider"></div>

        <div class="recap-row tresor highlight">
          <div class="label"><i class="fa-solid fa-gem"></i> Trésor trouvé</div>
          <div class="value trouve full-width">--</div>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-lg-2 infoBar">
      <div class="panel budget-panel mb-3">
        <div class="panel-header"><i class="fa-solid fa-coins"></i> Budget</div>
        <div class="budget-value budget">
          <span class="value">--</span> <small>gold</small>
        </div>
      </div>

      <div class="panel mb-3">
        <div class="panel-header">
          <i class="fa-solid fa-arrows-rotate"></i> Turn
        </div>
        <div><small class="joue">Heros</small></div>
      </div>
      <div class="panel mb-3">
        <div class="panel-header">
          <i class="fa-regular fa-clock"></i> Vague
        </div>
        <div>
          <small class="vague-count">-</small>
        </div>
      </div>
      <div class="panel mb-3">
        <div class="panel-header"><i class="fa-solid fa-star"></i> Score</div>
        <div><small class="score">100</small></div>
      </div>
      <div class="panel mb-3 heros">
        <div class="panel-header">
          <i class="fa-solid fa-location-crosshairs"></i> Pos Héros (x,y)
        </div>
      </div>
    </div>
  </div>
</div>

<script
  src="{{ url_for('static', filename='js/renderGrille.js') }}"
  defer
></script>
<script
  src="{{ url_for('static', filename='js/sideBarButtons.js') }}"
  defer
></script>
<script
  src="{{ url_for('static', filename='js/infoBarCards.js') }}"
  defer
></script>

{% endblock %}
