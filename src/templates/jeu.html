{% extends "base.html" %} {% block content %}
<!--
https://getbootstrap.com/docs/5.3/layout/grid/ 
-->
<link rel="stylesheet" href="{{ url_for('static', filename='css/jeu.css') }}" />

<div class="container mt-4">
  <div class="row justify-content-center text-center title">
    <div class="col-12">
      <img
        src="{{ url_for('static', filename='temp.png') }}"
        alt="Jeu logo"
        style="max-height: 100px; width: auto"
        class="img-fluid mb-3"
      />
    </div>
  </div>

  <div class="row">
    <div class="col selectionSidebar">
      <div
        class="btn-group-vertical"
        role="group"
        aria-label="Vertical button group"
      >
        <button type="button" class="btn btn-primary" data-type="mur">
          Mur
        </button>
        <button type="button" class="btn btn-primary" data-type="piege 1">
          Piège _
        </button>
        <button type="button" class="btn btn-primary" data-type="piege 2">
          Piège ^
        </button>
        <button type="button" class="btn btn-primary" data-type="piege 3">
          Piège ¤
        </button>
      </div>
    </div>
    <div class="col" id="grid-board"></div>
  </div>
</div>

<script
  src="{{ url_for('static', filename='js/renderGrille.js') }}"
  defer
></script>
<script
  src="{{ url_for('static', filename='js/sideBarButtons.js') }}"
  defer
></script>

{% endblock %}
